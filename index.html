<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spine · JEE Edition</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1d22;--mut:#6b7080;--line:#e6e4dc;--acc:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--ink:#eceef3;--mut:#9aa0b0;--line:#272b34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--ink:#eceef3;--mut:#9aa0b0;--line:#272b34;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.btn,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;transition:all .15s}
button:hover{border-color:var(--acc)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip{border-radius:99px;padding:4px 11px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chips button{white-space:nowrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
form{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
form input[type=text]{flex:1;min-width:140px}
form textarea{flex:1 1 100%;resize:vertical}
a.btn{text-decoration:none;color:var(--ink);white-space:nowrap}
.big{font:700 44px/1 Georgia,serif;color:var(--acc)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .35s}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);white-space:nowrap}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.done{text-decoration:line-through;opacity:.5}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);padding:0;flex:none;line-height:1;font-size:13px}
.chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.blk{border-left:4px solid var(--line);padding:6px 10px;margin-bottom:6px;border-radius:0 10px 10px 0}
.blk.now{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:4px;display:block}
.timer{font:700 48px/1 ui-monospace,Menlo,monospace;text-align:center;margin:6px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-width:0;max-width:90px;border:0;background:none;font-size:10px;color:var(--mut);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.on{color:var(--acc);font-weight:600}
.dots button{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--card)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none}
.seg button.on{background:var(--card);font-weight:600}
body.locked #app,body.locked #nav{display:none}
#auth{display:none;position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:8;padding:24px 16px}
body.locked #auth{display:flex;align-items:center;justify-content:center}
.av{width:52px;height:52px;flex:none;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 19px Georgia,serif}
.pf{display:flex;flex-direction:column;gap:10px}
.pf label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.pf .row label{min-width:0}
a.btn{text-decoration:none;text-align:center}
#auth .box{width:100%;max-width:400px}
#auth [hidden]{display:none!important}
#auth h1{font-size:30px;margin-bottom:4px}
#auth form{display:flex;flex-direction:column;gap:10px}
#auth label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
#auth input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#auth input:focus{outline:2px solid var(--acc);outline-offset:-1px}
#auth .pri{padding:11px;font-weight:600;margin-top:4px}
#auth .pri:disabled{opacity:.6;cursor:wait}
#auth .msg{font-size:13px;border-radius:10px;padding:9px 12px;display:none}
#auth .msg.err{display:block;background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad)}
#auth .msg.ok{display:block;background:color-mix(in srgb,var(--ok) 12%,var(--card));color:var(--ok)}
#auth .link{border:0;background:none;color:var(--acc);padding:0;font-size:13px}
@media (max-width:620px){</style>
</head>
<body class="locked">
<div id="auth"><div class="box">
<h1>Spine</h1><div class="mut" style="margin-bottom:18px">JEE Edition · your personal prep dashboard</div>
<div class="c" style="padding:18px">
<div class="seg" id="auth-seg"><button type="button" data-m="login" class="on">Sign in</button><button type="button" data-m="signup">Sign up</button></div>
<form id="auth-form" novalidate>
<div class="msg" id="auth-msg" role="status"></div>
<label id="f-name" hidden>Full name<input name="name" autocomplete="name" placeholder="Your name"></label>
<label id="f-email">Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
<label id="f-pass">Password<input name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required></label>
<button class="pri" id="auth-go" type="submit">Sign in</button>
<div class="row" style="justify-content:space-between"><button type="button" class="link" id="auth-forgot">Forgot password?</button><button type="button" class="link" id="auth-switch">New here? Create an account</button></div>
</form>
</div>
<div class="mut" style="text-align:center">Loading…</div>
</div></div>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const D=864e5,now=new Date();now.setHours(0,0,0,0);
const day=n=>new Date(+now+n*D),diff=d=>Math.round((+d-+now)/D);
const fmt=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUBJ=['Physics','Chemistry','Maths'],CAUSE=['Concept','Calculation','Silly','Time'];
const ACC={Indigo:'#4f46e5',Emerald:'#059669',Rose:'#e11d48',Amber:'#d97706'};
let uid=100;
const S={tab:'today',sub:'timeline',subj:'Physics',lf:'All',mf:'All',calm:false,unlocked:false,bad:false,theme:'auto',
exam:new Date(2027,4,23),editExam:false,
tasks:[],log:[],ch:[],mist:[],led:[],
ts:'current',sync:null,ms:'All',lq:'',goal:90,ss:'Physics',sx:'Advanced',op:{},syl:[],lec:[],mat:[],
topics:[],back:[],vault:[],
T:{left:1500,len:25,run:false,s:'Physics'}};
const KEYS=['tasks','log','ch','mist','led','vault','topics','back','sync','mat','lec','goal','syl','sylv','sx','exam','clean','theme','acc','calm'];
try{const sv=JSON.parse(localStorage.getItem('spine-jee')||'null');if(sv&&sv.topics){const sh=Math.round((+now-sv.saved)/D)||0;(sv.log||[]).forEach(l=>l.d-=sh);(sv.led||[]).forEach(l=>l.due-=sh);(sv.back||[]).forEach(b=>b.due-=sh);if(sv.exam)sv.exam=new Date(sv.exam);else delete sv.exam;delete sv.saved;Object.assign(S,sv)}}catch(e){}
const DEMO={"tasks":["t",["Rotational Motion: 25 PYQs","Revise GOC reaction mechanisms","Integration: definite integral properties","Fix mistakes from AITS-3","Formula sheet: Thermodynamics"]],"log":["txt",["Rotational motion PYQs","Woke 7:30, focus feels high","Organic GOC mechanisms","Limits and continuity sheet","AITS-3 · 142/360","Electrostatics theory","Integration practice set","Mole concept numericals","Laws of motion, friction","Slept late, low energy in class","Complex numbers","Chemical bonding","Kinematics graphs","Revise Hess law tomorrow"]],"mist":["q",["Rolling without slipping: used wrong friction direction","Definite integral: sign error after substitution","Marked wrong option for most stable carbocation","Spent 9 minutes on a 3-mark capacitor question"]],"led":["t",["JEE Advanced registration window opens","Full-length mock test (AITS)","Revise organic named reactions","Download admit card","Mobile data recharge","Library membership renewal"]],"vault":["t",["JEE Main scorecard","Admit card (Advanced)","Student ID, coaching","Emergency info"]],"topics":["n",["Rotational Motion","Electrostatics","Chemical Equilibrium","Organic: Isomerism","Definite Integration","Equilibrium","Some Basic Principles of Organic Chemistry","Integral Calculus"]],"back":["n",["Current Electricity","Thermodynamics numericals","Probability","Magnetism"]],"lec":["n",["Lecture 3: Torque and angular momentum","Lecture 4: Rolling motion","Lecture 5: Moment of inertia problems","Lecture 1: Coulomb’s law and electric field","Lecture 2: Gauss’s law","Lecture 2: Le Chatelier and Kc","Lecture 3: Properties and King’s rule","Lecture 1: Drift velocity and resistance"]],"mat":["t",["Physics chapter notes and PYQs","Rotational Motion module","Chemical Equilibrium revision notes"]]};
if(!S.clean){Object.entries(DEMO).forEach(([k,[f,v]])=>{if(Array.isArray(S[k]))S[k]=S[k].filter(x=>!v.includes(x[f]))});S.clean=1}
const save=()=>{try{const o=Object.fromEntries(KEYS.map(k=>[k,S[k]]));o.saved=+now;localStorage.setItem('spine-jee',JSON.stringify(o))}catch(e){}};
try{const raw=JSON.parse(localStorage.getItem('spine-jee')||'null');if(!raw||!raw.syl)S.syl.forEach(syncChapter)}catch(e){}
const minsToday=()=>S.log.filter(l=>l.d===0&&l.k==='study').reduce((a,l)=>a+l.min,0);
const heatH=i=>S.log.filter(l=>l.d===-i&&l.k==='study').reduce((a,l)=>a+l.min,0)/60;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('on'),1800)}
function addRep(d,r){const x=day(d);if(r.u==='day')x.setDate(x.getDate()+r.n);if(r.u==='week')x.setDate(x.getDate()+7*r.n);if(r.u==='month')x.setMonth(x.getMonth()+r.n);if(r.u==='year')x.setFullYear(x.getFullYear()+r.n);return diff(x)}
function parse(s){let x=s.trim(),l=x.toLowerCase(),rep=null,due=7;
let m=l.match(/every\s*(\d+)?\s*(day|week|month|year)s?/);if(m){rep={n:+(m[1]||1),u:m[2]};x=x.replace(m[0],'')}
m=l.match(/in\s+(\d+)\s*(day|week)s?/);if(m){due=+m[1]*(m[2]==='week'?7:1);x=x.replace(new RegExp(m[0],'i'),'')}
else if(/tomorrow/.test(l)){due=1;x=x.replace(/tomorrow/i,'')}
else if(/today/.test(l)){due=0;x=x.replace(/today/i,'')}
else{const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];m=l.match(/(?:on|from)?\s*(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*/);
if(m){let d=new Date(now.getFullYear(),mo.indexOf(m[2]),+m[1]);if(d<now)d.setFullYear(d.getFullYear()+1);due=diff(d);x=x.replace(new RegExp(m[0],'i'),'')}}
x=x.replace(/\s+/g,' ').replace(/\s(from|on)$/i,'').trim();x=x.charAt(0).toUpperCase()+x.slice(1);
const ty=/mock|test|aits/.test(l)?'Mock':/revis|formula|notes/.test(l)?'Revision':/exam|form|fee|admit|register|registration/.test(l)?'Exam':'Admin';
return{t:x||'Untitled',ty,due,rep}}
const pct=s=>{const c=S.ch.filter(x=>x.s===s);return c.length?Math.round(c.reduce((a,x)=>a+x.p,0)/c.length):0};
const blocks=[['Morning revision','7:00–10:00 AM',7,10],['Classes','12:00–4:30 PM',12,16.5],['Self-study and PYQs','5:30–8:30 PM',17.5,20.5],['Night deep work','10:00 PM–1:00 AM',22,25]];
function curBlock(){const d=new Date();let h=d.getHours()+d.getMinutes()/60;if(h<1)h+=24;return blocks.findIndex(b=>h>=b[2]&&h<b[3])}
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
const chips=(arr,cur,act)=>`<div class="chips">${arr.map(x=>`<button class="chip ${cur===x?'on':''}" data-a="${act}" data-v="${x}">${x}</button>`).join('')}</div>`;

function today(){
const dl=diff(S.exam),open=S.tasks.filter(t=>!t.done),weak=[...S.ch].sort((a,b)=>a.p-b.p)[0],
week=S.led.filter(l=>l.due<=7).length,bl=S.back.length,tl=S.calm?open.slice(0,3):S.tasks,bi=curBlock(),
th=minsToday();
return `<div class="c"><div class="row"><div><div class="big">${dl}</div><div class="mut">days to target exam</div></div><div class="sp"></div>
<div style="text-align:right"><div class="mut">${fmt(S.exam)} ${S.exam.getFullYear()}</div><button data-a="editExam" class="chip">${S.editExam?'Close':'Edit date'}</button></div></div>
${S.editExam?`<form data-f="exam" style="margin:10px 0 0"><input type="date" name="d" value="${S.exam.toISOString().slice(0,10)}"><button class="pri">Save</button></form>`:''}</div>
<h2>Today’s brief</h2><div class="c">You have <b>${open.length}</b> open task${open.length===1?'':'s'}, <b>${week}</b> ledger item${week===1?'':'s'} due this week and <b>${bl}</b> backlog${bl===1?'':'s'} still to clear. In class right now: <b>${S.topics.filter(t=>t.st!=='Done').slice(0,2).map(t=>esc(t.n)).join(', ')||'nothing added yet'}</b>. ${weak?`Weakest chapter right now: <b>${esc(weak.n)}</b> (${weak.p}%).`:''} You’ve logged <b>${Math.floor(th/60)}h ${th%60}m</b> of study today. Classes run 12:00–4:30 PM, so keep the evening for PYQs and the late hours for deep work.</div>
<h2>Daily rhythm</h2>${blocks.map((b,i)=>`<div class="blk ${i===bi?'now':''}"><b>${b[0]}</b> <span class="mut">· ${b[1]}</span>${i===bi?' <span class="tag">now</span>':''}</div>`).join('')}
<h2>Recorded lectures</h2>${lecCard()}<h2>Focus timer</h2><div class="c"><div class="timer" id="tm">${tm()}</div>
<div class="row" style="justify-content:center;margin-bottom:10px">${[25,50,90].map(m=>`<button class="chip ${S.T.len===m?'on':''}" data-a="tlen" data-v="${m}">${m} min</button>`).join('')}<select data-a="tsub">${SUBJ.map(s=>`<option ${S.T.s===s?'selected':''}>${s}</option>`).join('')}</select></div>
<div class="row" style="justify-content:center"><button class="pri" data-a="tgo">${S.T.run?'Pause':'Start'}</button><button data-a="treset">Reset</button></div></div>
<div class="top"><h2>Tasks</h2><button class="chip ${S.calm?'on':''}" data-a="calm">Calm mode</button></div>
<form data-f="task"><input type="text" name="t" placeholder="Add a task" required><select name="s">${opts(SUBJ)}</select><button class="pri">Add</button></form>
${tl.map(t=>`<div class="c row"><button class="chk ${t.done?'on':''}" data-a="tdone" data-id="${t.id}">${t.done?'✓':''}</button><div class="sp ${t.done?'done':''}">${esc(t.t)}</div><span class="tag">${t.s}</span><button class="chip" data-a="tdel" data-id="${t.id}">×</button></div>`).join('')||'<div class="mut">Nothing here. Add a task above.</div>'}`}
const tm=()=>String(Math.floor(S.T.left/60)).padStart(2,'0')+':'+String(S.T.left%60).padStart(2,'0');

function prep(){
const cs=S.ch.filter(c=>c.s===S.subj),ms=S.mist.filter(m=>S.mf==='All'||m.c===S.mf);
return `<div class="seg">${SUBJ.map(s=>`<button class="${S.subj===s?'on':''}" data-a="subj" data-v="${s}">${s} ${pct(s)}%</button>`).join('')}</div>
${cs.map(c=>`<div class="c"><div class="row"><div class="sp"><b>${c.n}</b></div><button class="chip" data-a="chp" data-id="${c.id}" data-v="-10">−</button><b style="width:44px;text-align:center">${c.p}%</b><button class="chip" data-a="chp" data-id="${c.id}" data-v="10">+</button></div><div class="bar" style="margin-top:8px"><i style="width:${c.p}%"></i></div></div>`).join('')}
<h2>Mistake notebook</h2>${chips(['All',...CAUSE],S.mf,'mf')}
<form data-f="mist"><select name="s">${opts(SUBJ)}</select><select name="c">${opts(CAUSE)}</select><input type="text" name="q" placeholder="What went wrong?" required><input type="text" name="f" placeholder="Fix or rule to remember" required><button class="pri">Save</button></form>
${ms.map(m=>`<div class="c"><div class="row"><span class="tag">${m.s}</span><span class="tag">${m.c}</span><div class="sp"></div><button class="chip ${m.rev?'on':''}" data-a="mrev" data-id="${m.id}">${m.rev?'Revised ✓':'Mark revised'}</button></div><div style="margin-top:6px"><b>${esc(m.q)}</b></div><div class="mut">→ ${esc(m.f)}</div></div>`).join('')||'<div class="mut">No mistakes in this category.</div>'}`}

function logTab(){
return `<div class="seg"><button class="${S.sub==='timeline'?'on':''}" data-a="sub" data-v="timeline">Timeline</button><button class="${S.sub==='review'?'on':''}" data-a="sub" data-v="review">Weekly review</button></div>`+(S.sub==='timeline'?timeline():review())}
function streak(){let n=0;for(let i=0;i<84;i++){if(heatH(i)>0)n++;else if(i>0)break;else continue}return n}
function timeline(){
const ds=[...new Set(S.log.map(l=>l.d))].sort((a,b)=>b-a);
return `<div class="c"><div class="row"><div><div class="big">${streak()}</div><div class="mut">day study streak</div></div></div>
<div class="heat" style="margin-top:12px">${Array.from({length:84},(_,k)=>{const i=83-k,h=heatH(i);return `<i title="${fmt(day(-i))}: ${h.toFixed(1)}h" style="background:color-mix(in srgb,var(--acc) ${h?Math.min(100,25+h*14):0}%,var(--line))"></i>`}).join('')}</div><div class="mut" style="margin-top:6px">Last 12 weeks · darker means more hours</div></div>
<form data-f="log"><select name="k"><option value="study">Study</option><option value="note">Note</option><option value="checkin">Check-in</option><option value="mock">Mock score</option></select><select name="s">${opts(SUBJ)}</select><input type="number" name="min" min="5" step="5" value="60" style="width:80px" title="Minutes"><input type="text" name="txt" placeholder="What did you do?" required><button class="pri">Add</button></form>
${ds.map(d=>`<h2>${d===0?'Today':d===-1?'Yesterday':fmt(day(d))}</h2>`+S.log.filter(l=>l.d===d).sort((a,b)=>b.time.localeCompare(a.time)).map(l=>`<div class="c row"><div class="mut" style="width:44px">${l.time}</div><div class="sp">${esc(l.txt)}</div>${l.k==='study'?`<span class="tag">${l.s} · ${l.min}m</span>`:`<span class="tag">${l.k}</span>`}<button class="chip" data-a="ldel" data-id="${l.id}" title="Delete entry">×</button></div>`).join('')).join('')}`}
function review(){
const st=S.log.filter(l=>l.k==='study'&&l.d>=-6),tot=st.reduce((a,l)=>a+l.min,0),by=SUBJ.map(s=>[s,st.filter(l=>l.s===s).reduce((a,l)=>a+l.min,0)]),mx=Math.max(...by.map(b=>b[1]),1),
mocks=S.log.filter(l=>l.k==='mock'),low=by.slice().sort((a,b)=>a[1]-b[1])[0],cc=CAUSE.map(c=>[c,S.mist.filter(m=>m.c===c).length]),topc=cc.slice().sort((a,b)=>b[1]-a[1])[0],
unrev=S.mist.filter(m=>!m.rev).length;
return `<div class="c"><div class="mut">This week</div><div class="big">${Math.floor(tot/60)}h ${tot%60}m</div><div class="mut">across ${new Set(st.map(l=>l.d)).size} study days · avg ${(tot/60/7).toFixed(1)}h/day</div></div>

function importSyl(txt,ex){let s=S.ss,ch=null,n=0;const T=new Set(),M={phy:'Physics',physics:'Physics',chem:'Chemistry',chemistry:'Chemistry',math:'Maths',maths:'Maths',mathematics:'Maths'};

<script type="module">
import {getUser,login,signup,logout,requestPasswordRecovery,updateUser,handleAuthCallback,onAuthChange,getSettings,AuthError,MissingIdentityError} from 'https://esm.sh/@netlify/identity@2';
const $=id=>document.getElementById(id),form=$('auth-form'),F=form.elements,msg=$('auth-msg'),go=$('auth-go');
const LABEL={login:'Sign in',signup:'Create account',forgot:'Send reset link',reset:'Set new password'};
let mode='login';
function say(t,ok){msg.textContent=t||'';msg.className='msg'+(t?ok?' ok':' err':'')}
function setMode(m){mode=m;say('');
  $('f-name').hidden=m!=='signup';$('f-email').hidden=m==='reset';$('f-pass').hidden=m==='forgot';
  F.password.autocomplete=m==='login'?'current-password':'new-password';
  F.password.parentNode.firstChild.textContent=m==='reset'?'New password':'Password';
  go.textContent=LABEL[m];
  document.querySelectorAll('#auth-seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('auth-seg').hidden=m==='reset';$('auth-forgot').hidden=m!=='login';
  $('auth-switch').textContent=m==='signup'?'Already have an account? Sign in':m==='login'?'New here? Create an account':'Back to sign in'}
function show(user){
  document.body.classList.toggle('locked',!user);document.body.classList.toggle('authed',!!user);
  window.SpineAuth.user=user;if(user&&S.tab==='profile')render()}
window.SpineAuth={user:null,
  save:async data=>{const u=await updateUser({data});window.SpineAuth.user=u;return u},
  password:password=>updateUser({password}),
  logout:async()=>{try{await logout()}catch(e){}show(null);setMode('login')}};
const ref=new URLSearchParams(location.search).get('ref');
if(ref){sessionStorage.setItem('spine-ref',ref.slice(0,16));history.replaceState(null,'',location.pathname+location.hash)}
function explain(e){
  if(e instanceof MissingIdentityError)return 'Accounts are not available right now. Please try again later.';
  if(e instanceof AuthError){
    if(e.status===401)return /confirm/i.test(e.message)?'Please confirm your email first — check your inbox.':'Invalid email or password.';
    if(e.status===403)return 'New sign-ups are currently closed.';
    if(e.status===422)return /registered|exists/i.test(e.message)?'An account with this email already exists. Try signing in.':e.message;
    return e.message}
  return 'Something went wrong. Please try again.'}
$('auth-seg').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)});
$('auth-switch').onclick=()=>setMode(mode==='login'?'signup':'login');
$('auth-forgot').onclick=()=>setMode('forgot');
form.addEventListener('submit',async e=>{e.preventDefault();
  const name=F.name.value.trim(),email=F.email.value.trim(),pw=F.password.value;
  if(mode!=='reset'&&!/^\S+@\S+\.\S+$/.test(email))return say('Enter a valid email address.');
  if(mode!=='forgot'&&pw.length<6)return say('Password must be at least 6 characters.');
  if(mode==='signup'&&!name)return say('Enter your name.');
  go.disabled=true;say('');
  try{
    if(mode==='login'){show(await login(email,pw))}
    else if(mode==='signup'){const u=await signup(email,pw,Object.assign({full_name:name},sessionStorage.getItem('spine-ref')?{referred_by:sessionStorage.getItem('spine-ref')}:{}));
      if(u.emailVerified)show(u);else{setMode('login');F.email.value=email;say('Almost there! We sent a confirmation link to '+email+'. Open it to activate your account.',1)}}
    else if(mode==='forgot'){await requestPasswordRecovery(email);setMode('login');say('If an account exists for '+email+', a reset link is on its way.',1)}
    else{await updateUser({password:pw});setMode('login');show(await getUser())}
    F.password.value=''}
  catch(err){say(explain(err))}
  finally{go.disabled=false}});
onAuthChange((ev,user)=>{if(mode!=='reset')show(user)});
setMode(sessionStorage.getItem('spine-ref')?'signup':'login');
document.querySelector('#auth .box > .mut:last-child').remove();
try{
  const r=await handleAuthCallback();
  if(r?.type==='recovery'){show(null);setMode('reset');say('Choose a new password for your account.',1)}
  else if(r?.type==='confirmation'){show(r.user);}
  else show(await getUser());
}catch(err){show(await getUser());say(explain(err))}
getSettings().then(s=>{if(s.disableSignup){document.querySelector('[data-m="signup"]').remove();if(mode==='login')$('auth-switch').hidden=true}}).catch(()=>{});
</script>
